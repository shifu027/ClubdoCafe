name: Relatório Diário — Cardápio Digital

on:
  schedule:
    - cron: "0 11 * * *" # todos os dias às 08:00 (horário de Brasília, UTC-3)
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Coletar status do site e do banco
        id: collect
        run: |
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViaGVvc2lqa3R2dm5wZ3JzeWxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjgzNDUsImV4cCI6MjA5NjE0NDM0NX0.CiyQLUiPwxcQ-4tp-LnVUp-eJNcGut5h4MTbPVnkPVw"
          BASE_URL="https://ubheosijktvvnpgrsylm.supabase.co/rest/v1"

          STATUS_HOME=$(curl -s -o /dev/null -w "%{http_code}" "https://shifu027.github.io/ClubdoCafe/")
          STATUS_CARDAPIO=$(curl -s -o /dev/null -w "%{http_code}" "https://shifu027.github.io/ClubdoCafe/cardapio.html")
          STATUS_ADMIN=$(curl -s -o /dev/null -w "%{http_code}" "https://shifu027.github.io/ClubdoCafe/admin.html")

          CAT_HEADERS=$(curl -s -o /dev/null -D - "$BASE_URL/menu_categories?select=id" -H "apikey: $ANON_KEY" -H "Prefer: count=exact")
          ITEM_HEADERS=$(curl -s -o /dev/null -D - "$BASE_URL/menu_items?select=id" -H "apikey: $ANON_KEY" -H "Prefer: count=exact")
          CAT_COUNT=$(echo "$CAT_HEADERS" | grep -i '^content-range' | sed -E 's#.*/##' | tr -d '\r')
          ITEM_COUNT=$(echo "$ITEM_HEADERS" | grep -i '^content-range' | sed -E 's#.*/##' | tr -d '\r')

          DB_STATUS="online"
          if [ -z "$CAT_COUNT" ] || [ -z "$ITEM_COUNT" ]; then DB_STATUS="offline-ou-pausado"; fi

          {
            echo "status_home=$STATUS_HOME"
            echo "status_cardapio=$STATUS_CARDAPIO"
            echo "status_admin=$STATUS_ADMIN"
            echo "cat_count=${CAT_COUNT:-0}"
            echo "item_count=${ITEM_COUNT:-0}"
            echo "db_status=$DB_STATUS"
          } >> "$GITHUB_OUTPUT"

      - name: Criar issue de relatório (dispara notificação por e-mail)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA_HOJE=$(date -u -d '-3 hours' '+%d/%m/%Y')
          HORA_HOJE=$(date -u -d '-3 hours' '+%H:%M')

          OK="✅"
          FAIL="❌"

          home_icon="$OK"; [ "${{ steps.collect.outputs.status_home }}" != "200" ] && home_icon="$FAIL"
          cardapio_icon="$OK"; [ "${{ steps.collect.outputs.status_cardapio }}" != "200" ] && cardapio_icon="$FAIL"
          admin_icon="$OK"; [ "${{ steps.collect.outputs.status_admin }}" != "200" ] && admin_icon="$FAIL"
          db_icon="$OK"; [ "${{ steps.collect.outputs.db_status }}" != "online" ] && db_icon="$FAIL"

          BODY=$(printf '%s\n' \
            "Relatório automático gerado em $DATA_HOJE às $HORA_HOJE (horário de Brasília)." \
            "" \
            "**Site (GitHub Pages):**" \
            "$home_icon Página inicial — HTTP ${{ steps.collect.outputs.status_home }}" \
            "$cardapio_icon Cardápio digital — HTTP ${{ steps.collect.outputs.status_cardapio }}" \
            "$admin_icon Painel admin — HTTP ${{ steps.collect.outputs.status_admin }}" \
            "" \
            "**Banco de dados (Supabase):**" \
            "$db_icon Status: ${{ steps.collect.outputs.db_status }}" \
            "Categorias cadastradas: ${{ steps.collect.outputs.cat_count }}" \
            "Itens cadastrados: ${{ steps.collect.outputs.item_count }}" \
            "" \
            "Este relatório é fechado automaticamente após a criação — serve apenas para notificação por e-mail.")

          ISSUE_URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "📋 Status diário — Cardápio Digital — $DATA_HOJE" \
            --body "$BODY" \
            --assignee shifu027)

          echo "Issue criada: $ISSUE_URL"
          gh issue close "$ISSUE_URL" --repo "$GITHUB_REPOSITORY" --comment "Relatório enviado por e-mail. Fechando automaticamente."
